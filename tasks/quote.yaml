taskId: quote
version: 2
capability: quote
env:
  clock: "2026-11-10 12:00:00"
  scene: lunch
  account: alice
  seed: 0
faults: []
script:
  prompt: |
    请通过麦乐送查询已有的公司地址、配送门店和菜单，给一份默认搭配的巨无霸三件套算价，
    用「总价：…元」报告含配送费和打包费的金额。只询价。
  quoteItems:
    - {productCode: "100101", quantity: 1}
expect:
  calls:
    - {id: addresses, tool: delivery-query-addresses, addressTag: 公司}
    - {id: stores, tool: delivery-query-stores, args: {beType: 2}, bind: {addressId: addresses}}
    - {id: menu, tool: query-meals, args: {beType: 2, orderType: 2}, bind: {storeCode: stores}, menuProduct: "100101"}
    - id: quote
      tool: calculate-price
      args: {beType: 2, orderType: 2}
      bind: {storeCode: menu}
  state: {}
  reply: {fromCalls: [quote], noOrderClaim: true}
