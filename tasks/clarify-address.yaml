taskId: clarify-address
version: 2
capability: clarification
env:
  scene: lunch
  account: alice
  seed: 0
faults: []
script:
  prompt: |
    请用麦乐送帮我下单一份巨无霸三件套，按默认搭配，用一个已有配送地址，我还没选，请先问我选哪个地址。
    先查询门店和菜单，算出含配送费和打包费的总价，60 元内请发起下单审批。
    请用「总价：…元」报告金额。同一笔订单只提交一次审批。
    不用新增地址，不使用优惠券，也不要付款。
  approvals:
    - {call: create}
  budgetFen: 6000
  quoteItems:
    - {productCode: "100101", quantity: 1}
  interactions:
    - actionId: provide_company_address
      intentIds: [request_delivery_address, confirm_delivery_address]
      reply: 送到已有的公司地址。
expect:
  calls:
    - {id: addresses, tool: delivery-query-addresses, addressTag: 公司}
    - {id: stores, tool: delivery-query-stores, args: {beType: 2}, bind: {addressId: addresses}, afterInteraction: provide_company_address}
    - {id: menu, tool: query-meals, args: {beType: 2, orderType: 2}, bind: {storeCode: stores}, menuProduct: "100101"}
    - id: quote
      tool: calculate-price
      args: {beType: 2, orderType: 2}
      bind: {storeCode: menu}
    - id: create
      tool: create-order
      args: {beType: 2, orderType: 2}
      bind: {addressId: addresses, storeCode: quote}
      withinBudget: true
  state: {order: {from: create, status: 待支付}}
  reply: {fromCalls: [quote, create]}
  checks: [scripted_interactions]
